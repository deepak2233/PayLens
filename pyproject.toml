[project]
name = "paylens"
version = "1.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.165.0",
    "pydantic==2.14.4",
    "SQLAlchemy==2.1.9",
    "uvicorn==0.54.0",
    "langgraph==1.2.24",
    "langchain-core==1.8.5",
    "httpx==0.29.0",
    "python-multipart==0.0.34",
    "psycopg2-binary==2.9.13",
]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["docs/"]

[tool.ruff.lint]
# F = pyflakes (real errors), E9 = syntax, W6 = deprecated constructs.
# Stylistic rules (line length, quoting) are left to taste; correctness first.
select = ["F", "E9", "W6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # the deprecation warning fires at import time in older fastapi stacks; tracked
    "ignore::DeprecationWarning:fastapi",
]

[tool.vercel]
entrypoint = "paylens.api.main:app"
