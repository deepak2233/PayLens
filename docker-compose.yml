services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 8s
      retries: 12

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: paylens
      POSTGRES_PASSWORD: ${PAYLENS_PG_PASSWORD:-paylens_dev_password}
      POSTGRES_DB: paylens
      PAYLENS_PG_READER_PASSWORD: ${PAYLENS_PG_READER_PASSWORD:-local_reader_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/dev-reader.sh:/docker-entrypoint-initdb.d/00-reader.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U paylens -d paylens"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment: &db
      PAYLENS_DATABASE_URL: postgresql+psycopg2://paylens:${PAYLENS_PG_PASSWORD:-paylens_dev_password}@postgres:5432/paylens
    command: python -m paylens.replay.ops migrate
    depends_on:
      postgres:
        condition: service_healthy

  producer:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: Dockerfile.consumer
    command: python scripts/produce_to_kafka.py --attempts-per-day 1500 --experiment-users-per-arm 1000
    environment: &stream
      <<: *db
      PAYLENS_EVENT_BUS: kafka
      PAYLENS_KAFKA_BOOTSTRAP: kafka:9092
      PAYLENS_ANCHOR_TS: "2026-11-20T23:59:00+00:00"
    depends_on:
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    environment: *stream
    depends_on:
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      <<: *db
      PAYLENS_ANALYTICS_DATABASE_URL: postgresql+psycopg2://paylens_reader:${PAYLENS_PG_READER_PASSWORD:-local_reader_password}@postgres:5432/paylens
      PAYLENS_API_TOKEN: ${PAYLENS_API_TOKEN:-local-paylens-only}
      PAYLENS_EVENT_BUS: kafka
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  kafka-data:
