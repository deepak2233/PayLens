# PayLens production layer: Kafka (KRaft) + PostgreSQL + consumer + API.
#
#   docker compose up --build          # start the stack
#   docker compose run producer        # push the synthetic dataset through Kafka
#   open http://localhost:8000/        # dashboard
#
# The demo layer needs none of this: `python cli.py demo` runs on SQLite.
version: "3.9"

services:
  kafka:
    image: bitnami/kafka:3.7
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_MESSAGE_MAX_BYTES=10485760
      - KAFKA_CFG_NUM_PARTITIONS=6
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=paylens
      - POSTGRES_PASSWORD=${PAYLENS_PG_PASSWORD:-paylens_dev_password}
      - POSTGRES_DB=paylens
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paylens"]
      interval: 5s
      timeout: 5s
      retries: 10

  # one-shot job: generate the synthetic dataset and produce it to Kafka
  producer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    command: python scripts/produce_to_kafka.py --attempts-per-day 50000
    environment: &prod_env
      PAYLENS_EVENT_BUS: kafka
      PAYLENS_KAFKA_BOOTSTRAP: kafka:9092
      PAYLENS_DATABASE_URL: postgresql+psycopg2://paylens:${PAYLENS_PG_PASSWORD:-paylens_dev_password}@postgres:5432/paylens
      PAYLENS_ANCHOR_TS: "2026-11-20T23:59:00+00:00"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: "no"

  # long-running worker: consume payment-events / experiment-exposures -> Postgres
  consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    command: python -m paylens.streaming.consumer
    environment: *prod_env
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # analytics API + dashboard
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: uvicorn paylens.api.main:app --host 0.0.0.0 --port 8000
    environment: *prod_env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
